services:
  aggregator:
    build: ./aggregator
    ports:
      - "9000:9000"

  client1:
    build: ./client
    environment:
      - CLIENT_NAME=client1
    volumes:
      - ./data/client1:/data
    depends_on:
      - aggregator

  client2:
    build: ./client
    environment:
      - CLIENT_NAME=client2
    volumes:
        - ./data/client2:/data
    depends_on:
      - aggregator